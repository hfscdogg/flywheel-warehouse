name: lint

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: shellcheck -s bash scripts/*.sh scripts/lib/*.sh
      - name: bash -n
        run: |
          for f in scripts/*.sh scripts/lib/*.sh; do
            bash -n "$f"
          done
      - name: Dry-run plan must succeed without gcloud
        run: DRY_RUN=1 ./scripts/setup.sh livewire

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all pipeline modules
        run: python -m compileall -q pipelines
      - name: Unit tests (stdlib-only, no GCP deps needed)
        run: python -m unittest discover -s pipelines/tests -v
