name: ingest-vendordrop

on:
  schedule:
    - cron: "50 6 * * *" # after the API ingests, before the 07:00 transform
  workflow_dispatch:
    inputs:
      client:
        description: Client slug
        default: livewire

concurrency:
  group: ingest-vendordrop-${{ inputs.client || 'livewire' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # WIF token exchange
  issues: write # alert.yml opens the failure issue; a called
                # workflow cannot hold a permission its caller lacks

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipelines/requirements.txt
      - name: Ingest vendor report drops → raw_vendor
        env:
          VENDOR_DROP_BUCKET: ${{ vars.VENDOR_DROP_BUCKET }}
        # A no-op on days nobody uploaded anything.
        run: >
          python -m pipelines.vendordrop.ingest
          --client "${{ inputs.client || 'livewire' }}"

  # Nothing told anyone when this broke. See .github/workflows/alert.yml.
  alert:
    needs: ingest
    if: failure()
    uses: ./.github/workflows/alert.yml
    with:
      workflow: ingest-vendordrop
    permissions:
      contents: read
      issues: write
