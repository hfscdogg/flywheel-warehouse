name: ingest-alarmdotcom

on:
  schedule:
    - cron: "30 6 * * *" # after dtools (06:20), before qbo (06:40)
  workflow_dispatch:
    inputs:
      client:
        description: Client slug
        default: livewire

concurrency:
  group: ingest-alarmdotcom-${{ inputs.client || 'livewire' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # WIF token exchange
  issues: write # alert.yml opens the failure issue; a called
                # workflow cannot hold a permission its caller lacks

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # Every dependency is installed, hash-checked, before the WIF token is
      # minted, so nothing pip fetches ever runs with a credential in reach.
      - run: pip install --require-hashes -r pipelines/requirements.txt
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          # This job's own account (scripts/lib/common.sh). No fallback: the
          # retired ingest-writer is gone, and an unset variable should fail
          # here rather than borrow some other account.
          service_account: ${{ vars.WIF_SA_INGEST_ALARMDOTCOM }}
      - name: Ingest Alarm.com → raw_alarmdotcom
        env:
          ALARMDOTCOM_DEALER_ID: ${{ vars.ALARMDOTCOM_DEALER_ID }}
          # Set only if v1 404s; the docs show both v1 and v1.0 forms.
          ALARMDOTCOM_API_VERSION: ${{ vars.ALARMDOTCOM_API_VERSION }}
          CLIENT: ${{ inputs.client || 'livewire' }}
        # Full pull every run (no documented modified-time filter).
        run: >
          python -m pipelines.alarmdotcom.ingest
          --client "$CLIENT"

  # Nothing told anyone when this broke. See .github/workflows/alert.yml.
  alert:
    needs: ingest
    if: failure()
    uses: ./.github/workflows/alert.yml
    with:
      workflow: ingest-alarmdotcom
    permissions:
      contents: read
      issues: write
