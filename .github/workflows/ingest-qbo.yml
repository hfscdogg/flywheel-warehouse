name: ingest-qbo

on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      client:
        description: Client slug
        default: livewire
      full_refresh:
        description: Ignore watermarks and pull everything
        type: boolean
        default: false

concurrency:
  group: ingest-qbo-${{ inputs.client || 'livewire' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # WIF token exchange
  issues: write # alert.yml opens the failure issue; a called
                # workflow cannot hold a permission its caller lacks

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          # This job's own account (scripts/lib/common.sh). Until the variable
          # is set it falls back to the retired ingest-writer, so merging this
          # changes nothing; 11-retire-ingest-writer.sh ends the fallback.
          service_account: ${{ vars.WIF_SA_INGEST_QBO || vars.WIF_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r pipelines/requirements.txt
      - name: Ingest QuickBooks Online → raw_qbo
        env:
          CLIENT: ${{ inputs.client || 'livewire' }}
          FULL_REFRESH: ${{ inputs.full_refresh == true && '--full-refresh' || '' }}
        run: >
          python -m pipelines.qbo.ingest
          --client "$CLIENT" $FULL_REFRESH

  # Nothing told anyone when this broke. See .github/workflows/alert.yml.
  alert:
    needs: ingest
    if: failure()
    uses: ./.github/workflows/alert.yml
    with:
      workflow: ingest-qbo
    permissions:
      contents: read
      issues: write
