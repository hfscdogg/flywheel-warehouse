name: ingest-isolved

on:
  schedule:
    - cron: "35 6 * * *" # after alarmdotcom (06:30), before qbo (06:40)
  workflow_dispatch:
    inputs:
      client:
        description: Client slug
        default: livewire
      full_refresh:
        description: Pull from ISOLVED_HISTORY_START instead of the trailing window
        type: boolean
        default: false

concurrency:
  group: ingest-isolved-${{ inputs.client || 'livewire' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # WIF token exchange
  issues: write # alert.yml opens the failure issue; a called
                # workflow cannot hold a permission its caller lacks

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # Every dependency is installed, hash-checked, before the WIF token is
      # minted, so nothing pip fetches ever runs with a credential in reach.
      - run: pip install --require-hashes -r pipelines/requirements.txt
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          # This job's own account (scripts/lib/common.sh). No fallback: an
          # unset variable should fail here rather than borrow another account.
          service_account: ${{ vars.WIF_SA_INGEST_ISOLVED }}
      - name: Ingest iSolved timecards → raw_isolved
        env:
          # Set only if the payroll provider moves the API host.
          ISOLVED_BASE_URL: ${{ vars.ISOLVED_BASE_URL }}
          CLIENT: ${{ inputs.client || 'livewire' }}
          FULL_REFRESH: ${{ inputs.full_refresh == true && '--full-refresh' || '' }}
        # The last five weeks every night: timecards are corrected after the
        # fact and the API has no modified-time filter.
        run: >
          python -m pipelines.isolved.ingest
          --client "$CLIENT" $FULL_REFRESH

  # Nothing told anyone when this broke. See .github/workflows/alert.yml.
  alert:
    needs: ingest
    if: failure()
    uses: ./.github/workflows/alert.yml
    with:
      workflow: ingest-isolved
    permissions:
      contents: read
      issues: write
