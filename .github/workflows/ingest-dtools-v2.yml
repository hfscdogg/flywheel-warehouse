name: ingest-dtools-v2

# D-Tools Cloud API v2: project cost, margin and quote number, and purchase
# order costs, into raw_dtools.v2_*. See pipelines/dtools/v2.py.
#
# Nightly from 2026-10-04: the first full load (2026-10-03) was read and the
# job-costing models built on it. Before the 07:00 UTC transform, after the
# other ingests. Needs the DTOOLS_V2_* values in clients/<slug>/client.env,
# the secret from scripts/05-ingestion-infra.sh (ingest-dtools may read it and
# add versions), and one device-code sign-in (python -m pipelines.dtools.signin).
on:
  schedule:
    - cron: "50 6 * * *"
  workflow_dispatch:
    inputs:
      client:
        description: Client slug
        default: livewire
      full_refresh:
        description: Ignore watermarks; re-fetch every project and purchase order
        type: boolean
        default: false
      limit:
        description: Stop each list after N records (0 = no limit; a smoke run)
        default: "0"

concurrency:
  group: ingest-dtools-v2-${{ inputs.client || 'livewire' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # WIF token exchange
  issues: write # alert.yml opens the failure issue; a called
                # workflow cannot hold a permission its caller lacks

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          # This job's own account (scripts/lib/common.sh). Until the variable
          # is set it falls back to the retired ingest-writer, so merging this
          # changes nothing; 11-retire-ingest-writer.sh ends the fallback.
          service_account: ${{ vars.WIF_SA_INGEST_DTOOLS || vars.WIF_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r pipelines/requirements.txt
      - name: Ingest D-Tools Cloud v2 → raw_dtools.v2_*
        env:
          CLIENT: ${{ inputs.client || 'livewire' }}
          FULL_REFRESH: ${{ inputs.full_refresh == true && '--full-refresh' || '' }}
          LIMIT: ${{ inputs.limit || '0' }}
        run: >
          python -m pipelines.dtools.v2
          --client "$CLIENT" --limit "$LIMIT" $FULL_REFRESH

  # Nothing told anyone when this broke. See .github/workflows/alert.yml.
  alert:
    needs: ingest
    if: failure()
    uses: ./.github/workflows/alert.yml
    with:
      workflow: ingest-dtools-v2
    permissions:
      contents: read
      issues: write
