name: ingest-zohobilling

on:
  schedule:
    - cron: "10 6 * * *" # between zoho (06:00) and dtools (06:20)
  workflow_dispatch:
    inputs:
      client:
        description: Client slug
        default: livewire
      customer_detail:
        description: Also fetch per-customer detail (billing addresses); resumes from the detail watermark, stops at the budget
        type: boolean
        default: false

concurrency:
  group: ingest-zohobilling-${{ inputs.client || 'livewire' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # WIF token exchange
  issues: write # alert.yml opens the failure issue; a called
                # workflow cannot hold a permission its caller lacks

jobs:
  ingest:
    runs-on: ubuntu-latest
    # The detail fetch budgets itself to 240 minutes and then stops cleanly;
    # this is the backstop above it, under the runner's own 360.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipelines/requirements.txt
      - name: Ingest Zoho Billing → raw_zohobilling
        env:
          ZOHO_BILLING_ORG_ID: ${{ vars.ZOHO_BILLING_ORG_ID }}
          # Per-customer detail (the only place a billing address exists) is
          # off unless asked for: the dispatch input for a hand-run backfill,
          # or the ZOHOBILLING_CUSTOMER_DETAIL repository variable to make it
          # nightly once the backfill has caught up. Empty means off.
          ZOHOBILLING_CUSTOMER_DETAIL: ${{ inputs.customer_detail && '1' || vars.ZOHOBILLING_CUSTOMER_DETAIL }}
        # Full pull every run by design (see pipelines/zohobilling/ingest.py):
        # no --full-refresh flag, no watermark to ignore. The detail fetch is
        # the one incremental piece and keeps its own watermark.
        run: >
          python -m pipelines.zohobilling.ingest
          --client "${{ inputs.client || 'livewire' }}"

  # Nothing told anyone when this broke. See .github/workflows/alert.yml.
  alert:
    needs: ingest
    if: failure()
    uses: ./.github/workflows/alert.yml
    with:
      workflow: ingest-zohobilling
    permissions:
      contents: read
      issues: write
