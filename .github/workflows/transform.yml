name: transform

on:
  schedule:
    - cron: "0 7 * * *" # after the 06:00/06:20/06:40 UTC ingests
  workflow_dispatch:
    inputs:
      client:
        description: Client slug
        default: livewire

concurrency:
  group: transform-${{ inputs.client || 'livewire' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # WIF token exchange

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2 # provides bq
      - name: Build staging + marts
        run: ./scripts/06-transform.sh "${{ inputs.client || 'livewire' }}"
