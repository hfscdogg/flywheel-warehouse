name: transform

on:
  schedule:
    # 09:15 UTC, after every source has landed. The API and vendor-drop
    # ingests start between 06:00 and 06:50, and BigQuery's Google Ads transfer (05:00,
    # plus the LSA account's at 05:30) loads one day every ~37 minutes and
    # re-loads days 2 to 7 back until about 08:45. At 07:00 the transform read
    # yesterday's ads, but the re-loads of days 5 to 7 back (late conversion
    # corrections, if any) landed after it (job history 2026-10-22 to 10-29).
    - cron: "15 9 * * *"
  workflow_dispatch:
    inputs:
      client:
        description: Client slug
        default: livewire
      validate:
        description: Dry run — check every model against BigQuery, build nothing
        type: boolean
        default: false

# A validate run builds nothing, so it has no reason to queue behind a real
# build or to make one wait — which is what a shared group would do, and the
# moment you most want to validate is right after a build went wrong. Separate
# groups; real builds still serialize against each other as before.
concurrency:
  group: transform-${{ inputs.client || 'livewire' }}${{ inputs.validate && '-validate' || '' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # WIF token exchange
  issues: write # alert.yml opens the failure issue; a called
                # workflow cannot hold a permission its caller lacks

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1 — provides bq
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          # This job's own account (scripts/lib/common.sh). No fallback: the
          # retired ingest-writer is gone, and an unset variable should fail
          # here rather than borrow some other account.
          service_account: ${{ vars.WIF_SA_TRANSFORM }}
      # VALIDATE=1 makes 06-transform.sh dry-run every model (bq query
      # --dry_run: full semantic validation, zero bytes processed, nothing
      # created) and exit non-zero if any model is invalid. On a schedule
      # `inputs` is empty, so this resolves to '0' and the nightly build is
      # unchanged.
      - name: Build staging + marts
        env:
          VALIDATE: ${{ inputs.validate && '1' || '0' }}
          CLIENT: ${{ inputs.client || 'livewire' }}
        run: ./scripts/06-transform.sh "$CLIENT"

  # Nothing told anyone when this broke. See .github/workflows/alert.yml.
  alert:
    needs: transform
    if: failure()
    uses: ./.github/workflows/alert.yml
    with:
      workflow: transform
    permissions:
      contents: read
      issues: write
