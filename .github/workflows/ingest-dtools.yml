name: ingest-dtools

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      client:
        description: Client slug
        default: livewire
      full_refresh:
        description: (D-Tools always full-pulls; flag accepted for symmetry)
        type: boolean
        default: false

concurrency:
  group: ingest-dtools-${{ inputs.client || 'livewire' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # WIF token exchange

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipelines/requirements.txt
      - name: Ingest D-Tools Cloud → raw_dtools
        run: >
          python -m pipelines.dtools.ingest
          --client "${{ inputs.client || 'livewire' }}"
