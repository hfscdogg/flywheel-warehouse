name: ingest-qbo-reports

# QuickBooks' own Profit & Loss, Balance Sheet and Cash Flow reports (monthly
# columns, three years back) and budgets, into raw_qbo.reports,
# raw_qbo.report_lines and raw_qbo.budgets. See pipelines/qbo/reports.py.
#
# Nightly since the first dispatched run (2026-09-25) was read: every section
# of every month added up, and sql/checks/qbo_reports_tie.sql now fails the
# transform if that stops. 06:25 UTC, before ingest-qbo at 06:40 (they share
# a token and queue behind each other) and the transform at 07:00, which
# freshness-checks what this lands at 3 days.
on:
  schedule:
    - cron: "25 6 * * *"
  workflow_dispatch:
    inputs:
      client:
        description: Client slug
        default: livewire

# SAME group as ingest-qbo, deliberately: both refresh the one rotating
# QuickBooks token, and two refreshes at once can leave the stored token
# already retired. GitHub queues whichever starts second.
concurrency:
  group: ingest-qbo-${{ inputs.client || 'livewire' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # WIF token exchange
  issues: write # alert.yml opens the failure issue; a called
                # workflow cannot hold a permission its caller lacks

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipelines/requirements.txt
      - name: QuickBooks reports and budgets → raw_qbo
        env:
          CLIENT: ${{ inputs.client || 'livewire' }}
        run: python -m pipelines.qbo.reports --client "$CLIENT"

  # Nothing told anyone when this broke. See .github/workflows/alert.yml.
  alert:
    needs: ingest
    if: failure()
    uses: ./.github/workflows/alert.yml
    with:
      workflow: ingest-qbo-reports
    permissions:
      contents: read
      issues: write
